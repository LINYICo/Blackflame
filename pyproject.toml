[project]
name = "blackflame"
version = "1.4.2"
description = "Inspect, edit, audit, and validate existing EPUB 2 and EPUB 3 publications."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "lxml",
]

[project.optional-dependencies]
epub = [
    "beautifulsoup4",
    "epublib; python_version >= '3.13'",
    "ebook-convert; python_version >= '3.12'",
]

[tool.uv]
package = false
