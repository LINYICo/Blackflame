target-version = "py311"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[lint.isort]
known-first-party = ["edit_plan", "epub_patch", "publication", "skill", "validation"]

[lint.per-file-ignores]
"tests/*.py" = ["E402"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
